version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: tuesday
      time: "12:00"
      timezone: Europe/Athens
    open-pull-requests-limit: 10
    reviewers:
      - mrholek
    labels:
      - dependencies
    cooldown:
      default-days: 7
    versioning-strategy: increase
    rebase-strategy: disabled
    ignore:
      # only minors and patches are automated; majors are coordinated upgrades taken
      # by hand — a single unusable one (typescript 7, blocked by typescript-eslint's
      # peer range) otherwise holds the whole group PR hostage
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
      # 0.x packages — a minor release is a breaking release
      - dependency-name: "@coreui/astro-docs*"
        update-types:
          - "version-update:semver-minor"
      - dependency-name: "bundlewatch"
        update-types:
          - "version-update:semver-minor"
      - dependency-name: "shelljs"
        update-types:
          - "version-update:semver-minor"
      # eslint-config-xo is pinned exactly (0.49.0) — block all updates
      - dependency-name: "eslint-config-xo"
      # legacy / test infra pinned to avoid churn
      - dependency-name: "jquery"
        update-types:
          - "version-update:semver-minor"
      - dependency-name: "hammer-simulator"
        update-types:
          - "version-update:semver-minor"
      - dependency-name: "karma*"
        update-types:
          - "version-update:semver-minor"
      # HTML validator — pinned to a specific version, even patches
      - dependency-name: "vnu-jar"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    groups:
      production-dependencies:
        dependency-type: "production"
      development-dependencies:
        dependency-type: "development"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
      day: tuesday
      time: "12:00"
      timezone: Europe/Athens
    cooldown:
      default-days: 7
    labels:
      - dependencies
    groups:
      github-actions:
        patterns:
          - "*"
